[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantx-server"
version = "0.1.0"
description = "FastAPI REST server for the QuantX quantum simulation engine"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
metrics = ["prometheus_client>=0.19.0"]
dev = [
    "pytest>=7.0",
    "httpx>=0.27.0",
    "anyio>=3.0",
    "aiosqlite>=0.19.0",
    "prometheus_client>=0.19.0",
]

[tool.setuptools]
packages = ["server", "server.backends", "server.routers", "server.auth", "server.observability"]

[tool.pytest.ini_options]
# Run from the server/ directory: `PYTHONPATH=.. pytest`
# testpaths are relative to the rootdir (server/)
testpaths = ["tests"]
addopts = "-q --tb=short"
