<text x="415" y="28" text-anchor="middle" font-size="15.5" font-weight="bold" fill="#111">Width, not qubit count, is what a fermionic VQE pays for</text>
<text x="415" y="48" text-anchor="middle" font-size="11.5" fill="#555">chain / ladder / cylinder at 12 qubits &#8212; same representation (d=4), same MPS length, same balanced cut, all lossless at &#967;=64</text>
<text x="415" y="66" text-anchor="middle" font-size="10.5" fill="#777">each width optimised at its OWN optimum, identical search protocol; the wider ones get MORE angles per layer (W=1: 3, W=2: 4, W=3: 4)</text>
