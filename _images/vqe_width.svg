<text x="415" y="424" text-anchor="middle" font-size="11" fill="#0a7d28" font-weight="bold">At depth 8 the error grows monotonically with width, &#215;3.6 from W=1 to W=3. Entropy across the balanced cut does NOT order the same way &#8212; peak at W=2.</text>
<text x="415" y="442" text-anchor="middle" font-size="9.5" fill="#777" font-style="italic">Same qubits, same simulator, same optimiser, more variational freedom for the wider lattices &#8212; only the graph differs. At 12 qubits the W=2 balanced cut slices a rung; the W=3 one is a clean column boundary.</text>
