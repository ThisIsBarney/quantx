# ReadTheDocs v2 configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

python:
  install:
    # Install the quantx-engine package (pure Python, no C++ build needed)
    - method: pip
      path: python
      extra_requirements:
        - dev
    # Sphinx + theme dependencies
    - requirements: docs/source/requirements.txt
