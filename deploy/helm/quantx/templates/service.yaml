apiVersion: v1
kind: Service
metadata:
  name: {{ include "quantx.fullname" . }}
  labels:
    {{- include "quantx.labels" . | nindent 4 }}
    {{- if .Values.metrics.serviceMonitor.enabled }}
    app.kubernetes.io/metrics: "true"
    {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "quantx.selectorLabels" . | nindent 4 }}
