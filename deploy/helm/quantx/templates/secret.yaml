{{- if or .Values.auth.apiKeys .Values.auth.jwtSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "quantx.fullname" . }}-secret
  labels:
    {{- include "quantx.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-keys: {{ .Values.auth.apiKeys | quote }}
  jwt-secret: {{ .Values.auth.jwtSecret | quote }}
{{- end }}
