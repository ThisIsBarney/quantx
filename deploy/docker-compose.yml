# QuantX deployment stack
# Usage:
#   cp deploy/.env.example .env   # edit as needed
#   docker compose -f deploy/docker-compose.yml up -d
#
# Services
# ────────
# quantx-api   FastAPI server (Python SDK solvers, async job queue)
# redis        Result cache + job store backend
# prometheus   Metrics scraper (scrapes /metrics every 15 s)
# grafana      Dashboard (pre-built QuantX dashboard auto-provisioned)

version: "3.9"

services:

  # ── QuantX API ──────────────────────────────────────────────────────────────
  quantx-api:
    image: quantx-api:${QUANTX_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${QUANTX_PORT:-8000}:8000"
    environment:
      # Job store: use Redis for persistence + horizontal scaling
      # Default to the Compose-internal Redis service; override via .env
      QUANTX_JOB_STORE_URL: "${QUANTX_JOB_STORE_URL:-redis://redis:6379/0}"
      # Auth (leave unset to run open-access in dev)
      QUANTX_API_KEYS: "${QUANTX_API_KEYS:-}"
      QUANTX_JWT_SECRET: "${QUANTX_JWT_SECRET:-}"
      QUANTX_RATE_LIMIT_RPM: "${QUANTX_RATE_LIMIT_RPM:-60}"
      # Observability
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_SERVICE_NAME: "quantx-api"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Prometheus ──────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - quantx-api

  # ── Grafana ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/quantx-dashboard.json:/var/lib/grafana/dashboards/quantx-dashboard.json:ro
    depends_on:
      - prometheus

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
