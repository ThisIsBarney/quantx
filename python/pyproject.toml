[build-system]
requires = ["setuptools>=77", "wheel"]  # >=77: SPDX string for project.license
build-backend = "setuptools.build_meta"

[project]
name = "quantx-engine"
dynamic = ["version"]
description = "Block-sparse tensor-network engine for quantum many-body physics: symmetric DMRG, TDVP and fermionic HVA circuits, with a Python API"
readme = "README.md"
requires-python = ">=3.10"
# SPDX string: the {text = ...} table form is deprecated and setuptools stops accepting it
# after 2027-02-18.
license = "MIT"
# The wheel is built from python/, so both files are copies of the root ones (a test keeps
# them identical). THIRD_PARTY_NOTICES.md covers the code compiled into the native engine.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
authors = [
  {name = "Marshall WU", email = "wujian.thu@gmail.com"},
]
keywords = ["quantum", "tensor-network", "dmrg", "mps", "many-body", "hubbard", "physics"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Physics",
  "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
]

[project.optional-dependencies]
# Development: testing only (scipy/networkx already in core deps)
dev = ["pytest>=7.0"]
pennylane = ["pennylane>=0.30.0"]
gpu = ["cupy-cuda12x>=13.0"]
distributed = ["ray[default]>=2.0"]

# Full CI suite: adds PennyLane for plugin tests
ci = [
    "pytest>=7.0",
    "pennylane>=0.30.0",
]

# Tutorial notebook execution in CI
notebooks = [
    "pytest>=7.0",
    "nbmake>=1.4",
    "nbformat>=5.9",
]

# Meta-extra: everything optional (GPU, distributed, hardware)
all = [
    "pennylane>=0.30.0",
    "cupy-cuda12x>=13.0",
    "ray[default]>=2.0",
]

# The repository is private as of 0.1.0's preparation: see "Before the first upload" in
# RELEASING.md.
[project.urls]
Homepage = "https://github.com/ThisIsBarney/quantx"
Changelog = "https://github.com/ThisIsBarney/quantx/blob/master/CHANGELOG.md"
Issues = "https://github.com/ThisIsBarney/quantx/issues"

[project.entry-points."pennylane.plugins"]
"quantx.statevector" = "quantx_engine.pennylane_plugin:QuantXDevice"

[tool.setuptools]
packages = ["quantx_engine"]

[tool.setuptools.dynamic]
# One version, in quantx_engine/__init__.py. pyproject used to say 1.0.0 while the package
# reported 0.4.0 at runtime.
version = {attr = "quantx_engine.__version__"}

[tool.setuptools.package-data]
# Include wheel-bundled native shared libraries so pip-installed packages
# can load the C++ engine without requiring QUANTX_LIB_PATH to be set.
quantx_engine = [
  "*.so",
  "*.dll",
  "*.dylib",
  "*.pyd",
]

# ── cibuildwheel configuration (M158 / M159) ──────────────────────────────────
# Run:  cibuildwheel --output-dir wheelhouse python/
[tool.cibuildwheel]
# The wheel is py3-none-<platform> (python/setup.py): cibuildwheel builds it for the first
# identifier, then reuses that same wheel for the others and runs test-command on each.
# So this list is the set of Pythons the one wheel is TESTED on; skip 32-bit and musl.
build = "cp310-* cp311-* cp312-* cp313-*"
skip  = "*-win32 *-manylinux_i686 *-musllinux*"

# cibuildwheel runs from the REPO ROOT with the package dir as its argument, so
# {project} is the repo root and {package} is python/. The hook used to say
# {project}/../scripts and {project}/quantx_engine -- one level too high for both, which is
# why every wheel job failed within a minute ("can't open file .../scripts/...").
# cmake comes from PyPI so the manylinux image's version does not matter; delvewheel is
# only used by the Windows repair step below, but installing it everywhere is harmless.
# pybind11 is deliberately NOT installed: see build_native_for_wheel.py (QX_WHEEL_PYBIND).
before-build = [
  "pip install cmake delvewheel",
  "python {project}/scripts/build_native_for_wheel.py {package}/quantx_engine",
]

# Smoke-test the installed wheel (scripts/wheel_smoke_test.py): the native engine must load
# from the wheel alone, at the version pip installed. Then the quick start (gate G1): a
# Hubbard ground state, a finite-temperature spectral function and an HVA circuit against
# their exact answers, on every platform wheel. Each command is one line: cmd.exe, which
# runs them on Windows, cuts a command at its first line break. cibuildwheel joins the
# list with &&.
test-command = [
  "python {project}/scripts/wheel_smoke_test.py",
  "python {project}/examples/quickstart.py",
]

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]
# engine.cpp uses std::filesystem, which Apple ships only from macOS 10.15; the default
# x86_64 deployment target is older, so Apple Clang rejects it as "unavailable". CMake
# reads this variable for CMAKE_OSX_DEPLOYMENT_TARGET and the wheel tag follows it, so
# delocate sees a library no newer than its tag. (arm64 starts at 11.0 regardless.)
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.windows]
archs = ["AMD64"]
# The native library is built with OpenMP, so quantx.dll imports the MSVC OpenMP runtime
# (vcomp140.dll), which a machine without the VC++ redistributable does not have. CI never
# notices: its runners have the redistributable. --analyze-existing makes delvewheel vendor
# the dependencies of DLLs already in the wheel, not only of extension modules.
repair-wheel-command = "delvewheel repair --analyze-existing -w {dest_dir} {wheel}"

# ── GPU / CUDA 12 wheel overrides (M168) ─────────────────────────────────────
# When QUANTX_BUILD_CUDA=1 is set in the environment (e.g. by the gpu-wheels
# CI workflow), the before-build hook compiles the native library with CUDA
# support and links against libcublas / libcurand from the CUDA 12 toolkit.
#
# End-users install GPU support via:
#   pip install "quantx-engine[gpu]"
# which adds cupy-cuda12x as a runtime dependency; no CUDA compile is needed
# by the end-user because CuPy ships prebuilt CUDA kernels.
[[tool.cibuildwheel.overrides]]
select = "*-manylinux_x86_64"
# Use CUDA 12-enabled manylinux image for builds tagged with QUANTX_BUILD_CUDA
environment = {QUANTX_BUILD_CUDA = "0"}  # default off; set to 1 in CI to enable

[tool.pytest.ini_options]
# Run from the python/ directory: `pytest` or `pytest quantx_engine/tests/`
testpaths = ["quantx_engine/tests"]
addopts = "-q --tb=short"
markers = [
    "hardware: marks tests that require real quantum hardware credentials (deselect with -m 'not hardware')",
    "gpu: marks tests that require a CUDA 12 device and cupy-cuda12x (deselect with -m 'not gpu')",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
