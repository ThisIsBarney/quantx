[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantx-engine"
version = "1.0.0"
description = "QuantX quantum simulation SDK — 130+ physics modules covering VQE, MBQC, LDPC codes, bosonic qubits, QSVT, dynamical decoupling, and more"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "QuantX Contributors"},
]
keywords = ["quantum", "simulation", "physics", "hamiltonian", "topological"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Physics",
  "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "networkx>=3.0",
]

[project.optional-dependencies]
# Development: testing only (scipy/networkx already in core deps)
dev = ["pytest>=7.0"]
pennylane = ["pennylane>=0.30.0"]
gpu = ["cupy-cuda12x>=13.0"]
distributed = ["ray[default]>=2.0"]

# Full CI suite: adds PennyLane for plugin tests
ci = [
    "pytest>=7.0",
    "pennylane>=0.30.0",
]

# Tutorial notebook execution in CI
notebooks = [
    "pytest>=7.0",
    "nbmake>=1.4",
    "nbformat>=5.9",
]

# Meta-extra: everything optional (GPU, distributed, hardware)
all = [
    "pennylane>=0.30.0",
    "cupy-cuda12x>=13.0",
    "ray[default]>=2.0",
]

[project.entry-points."pennylane.plugins"]
"quantx.statevector" = "quantx_engine.pennylane_plugin:QuantXDevice"

[tool.setuptools]
packages = ["quantx_engine"]

[tool.setuptools.package-data]
# Include wheel-bundled native shared libraries so pip-installed packages
# can load the C++ engine without requiring QUANTX_LIB_PATH to be set.
quantx_engine = [
  "*.so",
  "*.dll",
  "*.dylib",
  "*.pyd",
]

# ── cibuildwheel configuration (M158 / M159) ──────────────────────────────────
# Run:  cibuildwheel --output-dir wheelhouse python/
[tool.cibuildwheel]
# Build CPython 3.10–3.13; skip 32-bit and musl libc.
build = "cp310-* cp311-* cp312-* cp313-*"
skip  = "*-win32 *-manylinux_i686 *-musllinux*"

# Install pybind11 before build so the script can detect and use it.
# M159: enables zero-copy NumPy paths in _quantx_py extension.
before-build = [
  "pip install pybind11",
  "python {project}/../scripts/build_native_for_wheel.py {project}/quantx_engine",
]

# Smoke-test the installed wheel: verify native engine + pybind11 fast path.
test-command = """python -c "
from quantx_engine import backend_info
from quantx_engine.engine import Engine
info = backend_info()
print('native:', info['native'], '| version:', info['version'])
print('pybind11:', Engine.pybind11_available())
assert info['native'], 'Native engine not found in wheel'
print('M159 smoke test PASSED')
" """

[tool.cibuildwheel.linux]
manylinux-x86_64-image = "manylinux_2_28"
repair-wheel-command = "auditwheel repair -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
archs = ["arm64", "x86_64"]
repair-wheel-command = "delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.windows]
archs = ["AMD64"]

# ── GPU / CUDA 12 wheel overrides (M168) ─────────────────────────────────────
# When QUANTX_BUILD_CUDA=1 is set in the environment (e.g. by the gpu-wheels
# CI workflow), the before-build hook compiles the native library with CUDA
# support and links against libcublas / libcurand from the CUDA 12 toolkit.
#
# End-users install GPU support via:
#   pip install "quantx-engine[gpu]"
# which adds cupy-cuda12x as a runtime dependency; no CUDA compile is needed
# by the end-user because CuPy ships prebuilt CUDA kernels.
[[tool.cibuildwheel.overrides]]
select = "*-manylinux_x86_64"
# Use CUDA 12-enabled manylinux image for builds tagged with QUANTX_BUILD_CUDA
environment = {QUANTX_BUILD_CUDA = "0"}  # default off; set to 1 in CI to enable

[tool.pytest.ini_options]
# Run from the python/ directory: `pytest` or `pytest quantx_engine/tests/`
testpaths = ["quantx_engine/tests"]
addopts = "-q --tb=short"
markers = [
    "hardware: marks tests that require real quantum hardware credentials (deselect with -m 'not hardware')",
    "gpu: marks tests that require a CUDA 12 device and cupy-cuda12x (deselect with -m 'not gpu')",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
