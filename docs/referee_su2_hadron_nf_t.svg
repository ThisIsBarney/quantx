<svg xmlns="http://www.w3.org/2000/svg" width="760" height="704" viewBox="0 0 760 704" role="img" aria-labelledby="title desc">
<title id="title">n_f(t) of the SU(2) hadron circuits: an exact MPS against the published methods</title>
<desc id="desc">Two panels over Trotter steps 1 to 20. The MPS is exact to step 14; every published method drifts above it. docs/referee_su2_hadron_nf_t.csv holds every value.</desc>
<style>svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--axis:#c3c2b7;--band:#f0efec;--mps:#2a78d6;--tn:#eb6834;--pp_cpu:#1baf7a;--pp_gpu:#eda100;--qpu:#e87ba4;}@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink2:#c3c2b7;--muted:#898781;--grid:#2c2c2a;--axis:#383835;--band:#242422;--mps:#3987e5;--tn:#d95926;--pp_cpu:#199e70;--pp_gpu:#c98500;--qpu:#d55181;}}text{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}.t{fill:var(--ink);font-size:15px;font-weight:600}.s{fill:var(--ink2);font-size:12px}.m{fill:var(--muted);font-size:11px}.l{fill:var(--ink2);font-size:11.5px}line.g{stroke:var(--grid);stroke-width:1}line.a{stroke:var(--axis);stroke-width:1}.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}</style>
<rect width="760" height="704" fill="var(--surface)"/>
<text class="t" x="24" y="32">n_f(t) of the tracker's SU(2) hadron circuits, step by step</text>
<text class="s" x="24" y="52">The MPS (χ = 800) is exact through step 14: its truncations left the norm at 1 to 5e-5. The classical methods drift above it;</text>
<text class="s" x="24" y="68">the QPU swings both ways. The CSV beside this figure holds every value.</text>
<line x1="24" y1="92" x2="42" y2="92" stroke="var(--mps)" class="ln"/>
<text class="l" x="48" y="96">MPS of the circuits (this scan)</text>
<line x1="272.4" y1="92" x2="290.4" y2="92" stroke="var(--tn)" class="ln"/>
<text class="l" x="296.4" y="96">Tensor network (TDVP of H)</text>
<line x1="488.79999999999995" y1="92" x2="506.79999999999995" y2="92" stroke="var(--pp_cpu)" class="ln"/>
<text class="l" x="512.8" y="96">Pauli propagation, CPU</text>
<line x1="24" y1="110" x2="42" y2="110" stroke="var(--pp_gpu)" class="ln"/>
<text class="l" x="48" y="114">Pauli propagation, GPU</text>
<line x1="214.8" y1="110" x2="232.8" y2="110" stroke="var(--qpu)" class="ln"/>
<text class="l" x="238.8" y="114">QPU</text>
<rect x="439.2" y="156" width="160.8" height="238" fill="var(--band)"/>
<text class="m" x="445.2" y="170">MPS truncates</text>
