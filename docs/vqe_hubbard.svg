<text x="418" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Fermionic VQE on the block-sparse engine &#8212; how deep, and is it classically hard?</text>
<text x="418" y="52" text-anchor="middle" font-size="11.5" fill="#555">Hamiltonian Variational Ansatz, 1D Hubbard chain, U=4t, half filling; every layer conserves N and 2Sz, so the U(1)&#215;U(1) block engine simulates the circuit exactly</text>
<text x="418" y="70" text-anchor="middle" font-size="10.5" fill="#777">circuit vs a dense state-vector simulator: ~1e-15 (n=4), 4.0e-11 (n=6) &#8212; qx_hubbard_test, section HVA CIRCUIT</text>
