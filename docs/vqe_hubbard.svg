<text x="418" y="676" text-anchor="middle" font-size="11" fill="#0a7d28" font-weight="bold">At 64 qubits and depth 8 the circuit captures 88% of the correlation energy with S = 1.86 &#8212; simulated classically to a discarded weight of 4e-11 at &#967; = 4096.</text>
<text x="418" y="692" text-anchor="middle" font-size="9.5" fill="#777" font-style="italic">&#967; is the total bond dimension over all charge sectors at a 1e-10 cutoff, so it far exceeds e<tspan baseline-shift="super" font-size="7">S</tspan>; S is the cutoff-independent measure.</text>
