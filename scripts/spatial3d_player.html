<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>QuantX Spatial3D World Viewer</title>
  <style>
    :root {
      --bg-a: #091521;
      --bg-b: #0f2437;
      --panel: rgba(14, 26, 40, 0.8);
      --line: #35526a;
      --accent: #36cfc9;
      --text: #e8f0f7;
      --muted: #9ab0c2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 10% 0%, #14324b 0%, var(--bg-a) 46%, #060d16 100%);
      min-height: 100vh;
    }
    .wrap { max-width: 1380px; margin: 0 auto; padding: 16px; }
    .head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .title h1 { margin: 0; font-size: clamp(20px, 2.8vw, 30px); }
    .title p { margin: 5px 0 0; font-size: 13px; color: var(--muted); }
    .load, .controls, .meta, .legend {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      backdrop-filter: blur(6px);
    }
    .load {
      padding: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    input[type="text"] {
      min-width: 270px;
      width: min(460px, 45vw);
      padding: 7px 9px;
      border-radius: 8px;
      border: 1px solid #52718a;
      background: #0c1d2d;
      color: var(--text);
    }
    input[type="file"] { color: var(--muted); font-size: 12px; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 7px 12px;
      font-weight: 700;
      cursor: pointer;
      color: #042327;
      background: linear-gradient(135deg, #53e8d7, #32c6c0);
    }
    button.alt { color: #d9f2ff; background: linear-gradient(135deg, #2d4b63, #274058); }
    .content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 12px;
      min-height: 72vh;
    }
    .viewport {
      position: relative;
      border-radius: 14px;
      border: 1px solid var(--line);
      overflow: hidden;
      background: linear-gradient(180deg, #0d1f30 0%, #0a151f 100%);
      min-height: 460px;
    }
    #scene3d { width: 100%; height: 100%; display: block; }
    .legend {
      position: absolute;
      left: 10px;
      top: 10px;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--muted);
    }
    .side { display: flex; flex-direction: column; gap: 12px; }
    .meta, .controls { padding: 10px 12px; font-size: 13px; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .controls input[type="range"] { width: min(100%, 640px); }
    .mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; color: var(--muted); }
    .ctl { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
    .ctl input[type="range"] { width: 130px; }
    .ctl input[type="checkbox"] { transform: translateY(1px); }
    @media (max-width: 980px) {
      .content { grid-template-columns: 1fr; }
      .viewport { min-height: 56vh; }
      input[type="text"] { width: min(100%, 520px); }
      button { padding: 9px 14px; }
      .controls { gap: 10px; }
      .ctl { width: 100%; justify-content: space-between; }
      .ctl input[type="range"] { width: min(64vw, 230px); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="title">
        <h1>QuantX Spatial3D World Viewer</h1>
        <p>True 3D point-cloud playback with free camera orbit, like an in-world simulation viewer.</p>
      </div>
      <div class="load">
        <input id="jsonPath" type="text" value="quantum_spatial3d_wavepacket_barrier_periodic.json"/>
        <button id="loadPath">Load Path</button>
        <input id="filePick" type="file" accept="application/json"/>
        <button id="loadFile" class="alt">Load File</button>
      </div>
    </div>

    <div class="content">
      <div class="viewport">
        <canvas id="scene3d"></canvas>
        <div class="legend">
          Mouse: rotate/pan/zoom<br/>
          Arrow Left/Right: prev/next frame<br/>
          Space: play/pause
        </div>
      </div>
      <div class="side">
        <div id="meta" class="meta">No data loaded.</div>
        <div class="controls">
          <button id="prev" class="alt">Prev</button>
          <button id="play">Play</button>
          <button id="pause" class="alt">Pause</button>
          <button id="next" class="alt">Next</button>
          <label class="ctl">Point Size <input id="pointSize" type="range" min="3" max="30" step="1" value="11"/></label>
          <label class="ctl">Density Cutoff <input id="cutoff" type="range" min="0" max="100" step="1" value="0"/></label>
          <label class="ctl">Speed(ms) <input id="playMs" type="range" min="30" max="260" step="5" value="90"/></label>
          <label class="ctl"><span>Auto Rotate</span><input id="autoRotate" type="checkbox"/></label>
          <input id="slider" type="range" min="1" max="1" value="1"/>
          <span id="label">frame 0/0</span>
          <div id="diag" class="mono">points=0</div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const canvas = document.getElementById("scene3d");
    const meta = document.getElementById("meta");
    const slider = document.getElementById("slider");
    const label = document.getElementById("label");
    const diag = document.getElementById("diag");
    const pathInput = document.getElementById("jsonPath");
    const pointSizeCtl = document.getElementById("pointSize");
    const cutoffCtl = document.getElementById("cutoff");
    const playMsCtl = document.getElementById("playMs");
    const autoRotateCtl = document.getElementById("autoRotate");
    let DATA = null;
    let timer = null;
    let pointCutoffRatio = 0.0;

    if (!window.THREE || !THREE.OrbitControls) {
      meta.textContent = "Three.js failed to load. Check network/CDN access for WebGL player assets.";
      throw new Error("three.js unavailable");
    }

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(canvas.clientWidth || 800, canvas.clientHeight || 540, false);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1622);

    const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 2000);
    camera.position.set(10, 8, 10);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 0.9;

    const ambient = new THREE.AmbientLight(0x99b7c7, 0.85);
    const keyLight = new THREE.DirectionalLight(0xd7edf8, 1.1);
    keyLight.position.set(8, 12, 10);
    scene.add(ambient, keyLight);

    const axis = new THREE.AxesHelper(2.8);
    scene.add(axis);

    let worldBox = null;
    let pointsMesh = null;
    let pointsGeometry = null;
    let marker = null;

    function fitCameraToBounds(xMin, xMax, yMin, yMax, zMin, zMax) {
      const cx = 0.5 * (xMin + xMax);
      const cy = 0.5 * (yMin + yMax);
      const cz = 0.5 * (zMin + zMax);
      const sx = Math.max(1e-6, xMax - xMin);
      const sy = Math.max(1e-6, yMax - yMin);
      const sz = Math.max(1e-6, zMax - zMin);
      const radius = 0.5 * Math.sqrt(sx * sx + sy * sy + sz * sz);
      controls.target.set(cx, cy, cz);
      camera.position.set(cx + 1.3 * radius, cy + 0.9 * radius, cz + 1.4 * radius);
      camera.near = Math.max(0.01, radius / 250.0);
      camera.far = Math.max(100.0, radius * 30.0);
      camera.updateProjectionMatrix();
      controls.update();
    }

    function colorOf(t) {
      const x = Math.max(0, Math.min(1, t));
      const r = Math.min(1, Math.pow(x, 0.44) * 1.2);
      const g = Math.min(1, Math.pow(x, 1.2) * 0.85 + 0.12);
      const b = Math.min(1, 1.05 - x * 0.9);
      return [r, g, b];
    }

    function ensurePointBuffers(capacity) {
      if (!pointsGeometry || (pointsGeometry.getAttribute("position")?.count || 0) !== capacity) {
        if (pointsMesh) scene.remove(pointsMesh);
        pointsGeometry = new THREE.BufferGeometry();
        pointsGeometry.setAttribute("position", new THREE.Float32BufferAttribute(new Float32Array(capacity * 3), 3));
        pointsGeometry.setAttribute("color", new THREE.Float32BufferAttribute(new Float32Array(capacity * 3), 3));
        const material = new THREE.PointsMaterial({
          size: Number(pointSizeCtl.value) / 100.0,
          vertexColors: true,
          transparent: true,
          opacity: 0.92,
          depthWrite: false,
          sizeAttenuation: true,
        });
        pointsMesh = new THREE.Points(pointsGeometry, material);
        scene.add(pointsMesh);
      }
    }

    function renderFrame(frameIdx) {
      if (!DATA || !DATA.frames || DATA.frames.length === 0) return;
      const f = DATA.frames[frameIdx - 1];
      const points = Array.isArray(f.points) ? f.points : [];
      const cap = Math.max(points.length, 1);
      ensurePointBuffers(cap);

      const pos = pointsGeometry.getAttribute("position").array;
      const col = pointsGeometry.getAttribute("color").array;
      const vmax = Math.max(1e-12, Number(f.point_vmax || DATA.dens_max || 1e-9));
      const cutoff = pointCutoffRatio * vmax;

      let drawn = 0;
      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        const density = Math.max(0, Number(p[3]));
        if (density < cutoff) {
          continue;
        }
        const o = drawn * 3;
        pos[o] = Number(p[0]);
        pos[o + 1] = Number(p[1]);
        pos[o + 2] = Number(p[2]);
        const [r, g, b] = colorOf(Math.sqrt(density / vmax));
        col[o] = r;
        col[o + 1] = g;
        col[o + 2] = b;
        drawn += 1;
      }
      for (let i = drawn; i < cap; i++) {
        const o = i * 3;
        pos[o] = 0; pos[o + 1] = 0; pos[o + 2] = 0;
        col[o] = 0; col[o + 1] = 0; col[o + 2] = 0;
      }
      pointsGeometry.setDrawRange(0, drawn);
      pointsGeometry.attributes.position.needsUpdate = true;
      pointsGeometry.attributes.color.needsUpdate = true;

      if (!marker) {
        marker = new THREE.Mesh(
          new THREE.SphereGeometry(0.16, 18, 14),
          new THREE.MeshStandardMaterial({ color: 0xffd06e, emissive: 0x8a5e1b, emissiveIntensity: 0.7 })
        );
        scene.add(marker);
      }
      marker.position.set(Number(f.exp_x || 0), Number(f.exp_y || 0), Number(f.exp_z || 0));

      slider.value = String(frameIdx);
      label.textContent = `frame ${frameIdx}/${DATA.frames.length}`;
      diag.textContent = `points=${drawn}/${points.length} vmax=${vmax.toExponential(2)} cutoff=${pointCutoffRatio.toFixed(2)}`;
      meta.textContent = `boundary=${DATA.boundary}, potential=${DATA.potential_type}, t=${Number(f.t || 0).toFixed(3)}, norm=${Number(f.norm || 0).toFixed(6)}, <x,y,z>=(${Number(f.exp_x || 0).toFixed(3)}, ${Number(f.exp_y || 0).toFixed(3)}, ${Number(f.exp_z || 0).toFixed(3)})`;
    }

    function stepFrame(delta) {
      if (!DATA || !DATA.frames || DATA.frames.length === 0) return;
      const n = DATA.frames.length;
      let f = Number(slider.value || "1") + delta;
      if (f < 1) f = n;
      if (f > n) f = 1;
      renderFrame(f);
    }

    function loadData(obj) {
      if (!obj || !Array.isArray(obj.frames) || obj.frames.length === 0) {
        throw new Error("invalid spatial3d json: missing non-empty frames");
      }
      if (!Array.isArray(obj.frames[0].points)) {
        throw new Error("this viewer requires frame.points volumetric payload; regenerate json with latest exporter");
      }
      DATA = obj;
      slider.max = String(DATA.frames.length);
      slider.value = "1";

      if (worldBox) scene.remove(worldBox);
      const box = new THREE.Box3(
        new THREE.Vector3(Number(DATA.x_min), Number(DATA.y_min), Number(DATA.z_min)),
        new THREE.Vector3(Number(DATA.x_max), Number(DATA.y_max), Number(DATA.z_max))
      );
      worldBox = new THREE.Box3Helper(box, 0x2d8fbf);
      scene.add(worldBox);
      fitCameraToBounds(Number(DATA.x_min), Number(DATA.x_max), Number(DATA.y_min), Number(DATA.y_max), Number(DATA.z_min), Number(DATA.z_max));
      renderFrame(1);
    }

    async function loadFromPath() {
      const path = pathInput.value.trim();
      if (!path) return;
      const res = await fetch(path);
      if (!res.ok) throw new Error(`failed to fetch ${path}: ${res.status}`);
      loadData(await res.json());
    }

    async function loadFromFile() {
      const file = document.getElementById("filePick").files[0];
      if (!file) throw new Error("select a json file first");
      loadData(JSON.parse(await file.text()));
    }

    function doPlay() {
      if (!DATA || timer) return;
      timer = setInterval(() => stepFrame(1), Number(playMsCtl.value));
    }
    function doPause() {
      if (!timer) return;
      clearInterval(timer);
      timer = null;
    }

    document.getElementById("play").onclick = doPlay;
    document.getElementById("pause").onclick = doPause;
    document.getElementById("prev").onclick = () => stepFrame(-1);
    document.getElementById("next").onclick = () => stepFrame(1);
    slider.oninput = () => renderFrame(Number(slider.value));
    pointSizeCtl.oninput = () => {
      if (pointsMesh && pointsMesh.material) {
        pointsMesh.material.size = Number(pointSizeCtl.value) / 100.0;
        pointsMesh.material.needsUpdate = true;
      }
    };
    cutoffCtl.oninput = () => {
      pointCutoffRatio = Number(cutoffCtl.value) / 100.0;
      renderFrame(Number(slider.value || "1"));
    };
    playMsCtl.oninput = () => {
      if (timer) {
        doPause();
        doPlay();
      }
    };
    autoRotateCtl.onchange = () => {
      controls.autoRotate = !!autoRotateCtl.checked;
    };
    document.getElementById("loadPath").onclick = async () => {
      try { await loadFromPath(); } catch (e) { meta.textContent = `Load error: ${e.message}`; }
    };
    document.getElementById("loadFile").onclick = async () => {
      try { await loadFromFile(); } catch (e) { meta.textContent = `Load error: ${e.message}`; }
    };

    window.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowLeft") stepFrame(-1);
      else if (ev.key === "ArrowRight") stepFrame(1);
      else if (ev.key === " ") {
        ev.preventDefault();
        if (timer) doPause(); else doPlay();
      }
    });

    function renderLoop() {
      const w = canvas.clientWidth || 1;
      const h = canvas.clientHeight || 1;
      if (canvas.width !== Math.floor(w * renderer.getPixelRatio()) || canvas.height !== Math.floor(h * renderer.getPixelRatio())) {
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(renderLoop);
    }
    renderLoop();
  </script>
</body>
</html>
