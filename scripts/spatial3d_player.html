<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>QuantX Spatial3D World Viewer</title>
  <style>
    :root {
      --bg-a: #091521;
      --bg-b: #0f2437;
      --panel: rgba(14, 26, 40, 0.8);
      --line: #35526a;
      --accent: #36cfc9;
      --text: #e8f0f7;
      --muted: #9ab0c2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Noto Sans", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 10% 0%, #14324b 0%, var(--bg-a) 46%, #060d16 100%);
      min-height: 100vh;
    }
    .wrap { max-width: 1380px; margin: 0 auto; padding: 16px; }
    .head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .title h1 { margin: 0; font-size: clamp(20px, 2.8vw, 30px); }
    .title p { margin: 5px 0 0; font-size: 13px; color: var(--muted); }
    .load, .controls, .meta, .legend {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      backdrop-filter: blur(6px);
    }
    .load {
      padding: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    input[type="text"] {
      min-width: 270px;
      width: min(460px, 45vw);
      padding: 7px 9px;
      border-radius: 8px;
      border: 1px solid #52718a;
      background: #0c1d2d;
      color: var(--text);
    }
    input[type="file"] { color: var(--muted); font-size: 12px; }
    button {
      border: 0;
      border-radius: 8px;
      padding: 7px 12px;
      font-weight: 700;
      cursor: pointer;
      color: #042327;
      background: linear-gradient(135deg, #53e8d7, #32c6c0);
    }
    button.alt { color: #d9f2ff; background: linear-gradient(135deg, #2d4b63, #274058); }
    .content {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 330px;
      gap: 12px;
      min-height: 72vh;
    }
    .viewport {
      position: relative;
      border-radius: 14px;
      border: 1px solid var(--line);
      overflow: hidden;
      background: linear-gradient(180deg, #0d1f30 0%, #0a151f 100%);
      min-height: 460px;
    }
    #scene3d { width: 100%; height: 100%; display: block; }
    .legend {
      position: absolute;
      left: 10px;
      top: 10px;
      padding: 8px 10px;
      font-size: 12px;
      color: var(--muted);
    }
    #colorbar {
      position: absolute;
      right: 10px;
      top: 10px;
      border-radius: 4px;
      border: 1px solid var(--line);
    }
    #cbLabels {
      position: absolute;
      right: 36px;
      top: 10px;
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
      text-align: right;
    }
    .side { display: flex; flex-direction: column; gap: 12px; }
    .meta, .controls { padding: 10px 12px; font-size: 13px; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .controls input[type="range"] { width: min(100%, 640px); }
    .mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; color: var(--muted); }
    .ctl { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; }
    .ctl input[type="range"] { width: 130px; }
    .ctl input[type="checkbox"] { transform: translateY(1px); }
    .ctl select { background: #0c1d2d; color: var(--text); border: 1px solid #52718a; border-radius: 6px; padding: 3px 6px; }
    @media (max-width: 980px) {
      .content { grid-template-columns: 1fr; }
      .viewport { min-height: 56vh; }
      input[type="text"] { width: min(100%, 520px); }
      button { padding: 9px 14px; }
      .controls { gap: 10px; }
      .ctl { width: 100%; justify-content: space-between; }
      .ctl input[type="range"] { width: min(64vw, 230px); }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="head">
      <div class="title">
        <h1>QuantX Spatial3D World Viewer</h1>
        <p>3D point-cloud · slice planes · marching cubes isosurface · phase HSL colormap</p>
      </div>
      <div class="load">
        <input id="jsonPath" type="text" value="quantum_spatial3d_wavepacket_barrier_periodic.json"/>
        <button id="loadPath">Load Path</button>
        <input id="filePick" type="file" accept="application/json"/>
        <button id="loadFile" class="alt">Load File</button>
      </div>
    </div>

    <div class="content">
      <div class="viewport">
        <canvas id="scene3d"></canvas>
        <div class="legend">
          Mouse: rotate/pan/zoom<br/>
          Arrow Left/Right: prev/next frame<br/>
          Space: play/pause
        </div>
        <canvas id="colorbar" width="18" height="260"></canvas>
        <div id="cbLabels"></div>
      </div>
      <div class="side">
        <div id="meta" class="meta">No data loaded.</div>
        <div class="controls">
          <button id="prev" class="alt">Prev</button>
          <button id="play">Play</button>
          <button id="pause" class="alt">Pause</button>
          <button id="next" class="alt">Next</button>
          <label class="ctl">Render
            <select id="renderMode">
              <option value="points">Points</option>
              <option value="slices">Slice Planes</option>
              <option value="isosurface">Isosurface</option>
            </select>
          </label>
          <label class="ctl">Color
            <select id="colorMode">
              <option value="density">Density</option>
              <option value="phase">Phase HSL</option>
            </select>
          </label>
          <label class="ctl">Iso % <input id="isoLevel" type="range" min="1" max="99" step="1" value="20"/></label>
          <label class="ctl">Point Size <input id="pointSize" type="range" min="3" max="30" step="1" value="11"/></label>
          <label class="ctl">Density Cutoff <input id="cutoff" type="range" min="0" max="100" step="1" value="0"/></label>
          <label class="ctl">Speed(ms) <input id="playMs" type="range" min="30" max="260" step="5" value="90"/></label>
          <label class="ctl"><span>Auto Rotate</span><input id="autoRotate" type="checkbox"/></label>
          <input id="slider" type="range" min="1" max="1" value="1"/>
          <span id="label">frame 0/0</span>
          <div id="diag" class="mono">points=0</div>
        </div>
      </div>
    </div>
  </div>

  <script src="./vendor/three.min.js"></script>
  <script src="./vendor/OrbitControls.js"></script>
  <script>
    (function ensureThreeDeps() {
      function inject(src) {
        document.write('<script src="' + src + '"><\\/script>');
      }
      if (!window.THREE) {
        inject("https://unpkg.com/three@0.128.0/build/three.min.js");
      }
      if (!(window.THREE && THREE.OrbitControls)) {
        inject("https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js");
      }
    })();
  </script>
  <script>
    const canvas = document.getElementById("scene3d");
    const meta = document.getElementById("meta");
    const slider = document.getElementById("slider");
    const label = document.getElementById("label");
    const diag = document.getElementById("diag");
    const pathInput = document.getElementById("jsonPath");
    const pointSizeCtl = document.getElementById("pointSize");
    const cutoffCtl = document.getElementById("cutoff");
    const playMsCtl = document.getElementById("playMs");
    const autoRotateCtl = document.getElementById("autoRotate");
    const renderModeCtl = document.getElementById("renderMode");
    const colorModeCtl = document.getElementById("colorMode");
    const isoLevelCtl = document.getElementById("isoLevel");
    let DATA = null;
    let timer = null;
    let pointCutoffRatio = 0.0;

    if (!window.THREE || !THREE.OrbitControls) {
      meta.textContent = "Three.js failed to load. Ensure ./vendor/three.min.js and ./vendor/OrbitControls.js exist (or allow CDN fallback).";
      throw new Error("three.js unavailable");
    }

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(canvas.clientWidth || 800, canvas.clientHeight || 540, false);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b1622);

    const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 2000);
    camera.position.set(10, 8, 10);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.autoRotate = false;
    controls.autoRotateSpeed = 0.9;

    const ambient = new THREE.AmbientLight(0x99b7c7, 0.85);
    const keyLight = new THREE.DirectionalLight(0xd7edf8, 1.1);
    keyLight.position.set(8, 12, 10);
    scene.add(ambient, keyLight);

    const axis = new THREE.AxesHelper(2.8);
    scene.add(axis);

    let worldBox = null;
    let pointsMesh = null;
    let pointsGeometry = null;
    let marker = null;
    let isosurfaceMesh = null;

    // ── Colormap functions ───────────────────────────────────────────────────
    function colorOf(t) {
      const x = Math.max(0, Math.min(1, t));
      const r = Math.min(1, Math.pow(x, 0.44) * 1.2);
      const g = Math.min(1, Math.pow(x, 1.2) * 0.85 + 0.12);
      const b = Math.min(1, 1.05 - x * 0.9);
      return [r, g, b];
    }

    // Phase HSL colormap: phi in [-π,π] → RGB
    function phaseHSL(phi) {
      const h = ((phi + Math.PI) / (2 * Math.PI)) * 360;
      const s = 0.88, l = 0.52, a = s * Math.min(l, 1 - l);
      const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min((n + h / 30) % 12 - 3, 9 - (n + h / 30) % 12, 1))));
      return [f(0) / 255, f(8) / 255, f(4) / 255];
    }

    // Density colormap returning RGBA Uint8 for texture pixels
    function densityRGBA(t) {
      const x = Math.max(0, Math.min(1, t));
      return [
        Math.round(255 * Math.min(1, Math.pow(x, 0.44) * 1.2)),
        Math.round(255 * Math.min(1, Math.pow(x, 1.2) * 0.85 + 0.12)),
        Math.round(255 * Math.min(1, 1.05 - x * 0.9)),
        210,
      ];
    }

    // Phase HSL returning RGBA Uint8 for texture pixels
    function phaseRGBA(phi) {
      const h = ((phi + Math.PI) / (2 * Math.PI)) * 360;
      const s = 0.88, l = 0.52, a = s * Math.min(l, 1 - l);
      const f = n => Math.round(255 * (l - a * Math.max(-1, Math.min((n + h / 30) % 12 - 3, 9 - (n + h / 30) % 12, 1))));
      return [f(0), f(8), f(4), 220];
    }

    // ── Colorbar ─────────────────────────────────────────────────────────────
    function drawColorbar() {
      const cb = document.getElementById("colorbar");
      const ctx2 = cb.getContext("2d");
      const mode = colorModeCtl.value;
      const h = cb.height;
      for (let y = 0; y < h; y++) {
        const t = 1 - y / h;
        const rgba = mode === "phase" ? phaseRGBA((t * 2 - 1) * Math.PI) : densityRGBA(t);
        ctx2.fillStyle = `rgb(${rgba[0]},${rgba[1]},${rgba[2]})`;
        ctx2.fillRect(0, y, cb.width, 1);
      }
      const lblEl = document.getElementById("cbLabels");
      if (lblEl) {
        lblEl.innerHTML = mode === "phase"
          ? "+π<br><br><br><br><br><br><br>0<br><br><br><br><br><br><br>−π"
          : "max<br><br><br><br><br><br><br><br><br><br><br><br><br><br>0";
      }
    }

    // ── Camera fit ────────────────────────────────────────────────────────────
    function fitCameraToBounds(xMin, xMax, yMin, yMax, zMin, zMax) {
      const cx = 0.5 * (xMin + xMax);
      const cy = 0.5 * (yMin + yMax);
      const cz = 0.5 * (zMin + zMax);
      const sx = Math.max(1e-6, xMax - xMin);
      const sy = Math.max(1e-6, yMax - yMin);
      const sz = Math.max(1e-6, zMax - zMin);
      const radius = 0.5 * Math.sqrt(sx * sx + sy * sy + sz * sz);
      controls.target.set(cx, cy, cz);
      camera.position.set(cx + 1.3 * radius, cy + 0.9 * radius, cz + 1.4 * radius);
      camera.near = Math.max(0.01, radius / 250.0);
      camera.far = Math.max(100.0, radius * 30.0);
      camera.updateProjectionMatrix();
      controls.update();
    }

    // ── Point cloud ───────────────────────────────────────────────────────────
    function ensurePointBuffers(capacity) {
      if (!pointsGeometry || (pointsGeometry.getAttribute("position")?.count || 0) !== capacity) {
        if (pointsMesh) scene.remove(pointsMesh);
        pointsGeometry = new THREE.BufferGeometry();
        pointsGeometry.setAttribute("position", new THREE.Float32BufferAttribute(new Float32Array(capacity * 3), 3));
        pointsGeometry.setAttribute("color", new THREE.Float32BufferAttribute(new Float32Array(capacity * 3), 3));
        const material = new THREE.PointsMaterial({
          size: Number(pointSizeCtl.value) / 100.0,
          vertexColors: true,
          transparent: true,
          opacity: 0.92,
          depthWrite: false,
          sizeAttenuation: true,
        });
        pointsMesh = new THREE.Points(pointsGeometry, material);
        scene.add(pointsMesh);
      }
    }

    function updatePointCloud(f, colorMode) {
      const points = Array.isArray(f.points) ? f.points : [];
      const cap = Math.max(points.length, 1);
      ensurePointBuffers(cap);

      const pos = pointsGeometry.getAttribute("position").array;
      const col = pointsGeometry.getAttribute("color").array;
      const vmax = Math.max(1e-12, Number(f.point_vmax || DATA.dens_max || 1e-9));
      const cutoff = pointCutoffRatio * vmax;

      let drawn = 0;
      for (let i = 0; i < points.length; i++) {
        const p = points[i];
        const density = Math.max(0, Number(p[3]));
        if (density < cutoff) continue;
        const o = drawn * 3;
        pos[o] = Number(p[0]); pos[o + 1] = Number(p[1]); pos[o + 2] = Number(p[2]);
        let rgb;
        if (colorMode === "phase" && p[4] != null) {
          rgb = phaseHSL(Number(p[4]));
        } else {
          rgb = colorOf(Math.sqrt(density / vmax));
        }
        col[o] = rgb[0]; col[o + 1] = rgb[1]; col[o + 2] = rgb[2];
        drawn++;
      }
      for (let i = drawn; i < cap; i++) {
        const o = i * 3;
        pos[o] = 0; pos[o + 1] = 0; pos[o + 2] = 0;
        col[o] = 0; col[o + 1] = 0; col[o + 2] = 0;
      }
      pointsGeometry.setDrawRange(0, drawn);
      pointsGeometry.attributes.position.needsUpdate = true;
      pointsGeometry.attributes.color.needsUpdate = true;
      return drawn;
    }

    // ── Slice Plane Manager ───────────────────────────────────────────────────
    const sliceManager = (function () {
      const planes = {}, textures = {};

      function buildTexture(rows, cols, densArr, phaseArr, colorMode, densMax) {
        const data = new Uint8Array(cols * rows * 4);
        let p = 0;
        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            let rgba;
            if (colorMode === "phase" && phaseArr) {
              rgba = phaseRGBA(phaseArr[r][c]);
            } else {
              rgba = densityRGBA(densArr[r][c] / Math.max(1e-12, densMax));
            }
            data[p++] = rgba[0]; data[p++] = rgba[1]; data[p++] = rgba[2]; data[p++] = rgba[3];
          }
        }
        return data;
      }

      function makePlane(axis, bounds) {
        const { xMin, xMax, yMin, yMax, zMin, zMax } = bounds;
        const lx = xMax - xMin, ly = yMax - yMin, lz = zMax - zMin;
        const cx = 0.5 * (xMin + xMax), cy = 0.5 * (yMin + yMax), cz = 0.5 * (zMin + zMax);
        let geo;
        const mat = new THREE.MeshBasicMaterial({
          map: textures[axis],
          transparent: true,
          opacity: 0.82,
          side: THREE.DoubleSide,
          depthWrite: false,
        });
        let mesh;
        if (axis === "xy") {
          geo = new THREE.PlaneGeometry(lx, ly);
          mesh = new THREE.Mesh(geo, mat);
          mesh.position.set(cx, cy, cz);
        } else if (axis === "xz") {
          geo = new THREE.PlaneGeometry(lx, lz);
          mesh = new THREE.Mesh(geo, mat);
          mesh.rotation.x = -Math.PI / 2;
          mesh.position.set(cx, cy, cz);
        } else {
          geo = new THREE.PlaneGeometry(ly, lz);
          mesh = new THREE.Mesh(geo, mat);
          mesh.rotation.y = Math.PI / 2;
          mesh.position.set(cx, cy, cz);
        }
        return mesh;
      }

      function updateSlice(axis, densArr, phaseArr, colorMode, densMax, bounds) {
        if (!densArr || !densArr.length || !densArr[0].length) return;
        const rows = densArr.length, cols = densArr[0].length;
        const data = buildTexture(rows, cols, densArr, phaseArr, colorMode, densMax);
        if (!textures[axis]) {
          textures[axis] = new THREE.DataTexture(data, cols, rows, THREE.RGBAFormat);
          textures[axis].needsUpdate = true;
        } else {
          textures[axis].image = { data, width: cols, height: rows };
          textures[axis].needsUpdate = true;
        }
        if (!planes[axis]) {
          planes[axis] = makePlane(axis, bounds);
          scene.add(planes[axis]);
        } else {
          planes[axis].material.map = textures[axis];
          planes[axis].material.needsUpdate = true;
          planes[axis].visible = true;
        }
      }

      return {
        updateAll(f, colorMode, data) {
          const densMax = Math.max(1e-12, data.dens_max || 0);
          const bounds = {
            xMin: Number(data.x_min), xMax: Number(data.x_max),
            yMin: Number(data.y_min), yMax: Number(data.y_max),
            zMin: Number(data.z_min), zMax: Number(data.z_max),
          };
          updateSlice("xy", f.xy, f.phase_xy, colorMode, densMax, bounds);
          updateSlice("xz", f.xz, f.phase_xz, colorMode, densMax, bounds);
          updateSlice("yz", f.yz, f.phase_yz, colorMode, densMax, bounds);
        },
        hideAll() {
          for (const k of ["xy", "xz", "yz"]) if (planes[k]) planes[k].visible = false;
        },
        removeAll() {
          for (const k of ["xy", "xz", "yz"]) {
            if (planes[k]) { scene.remove(planes[k]); delete planes[k]; }
            if (textures[k]) { textures[k].dispose(); delete textures[k]; }
          }
        },
      };
    })();

    // ── Marching Cubes ────────────────────────────────────────────────────────
    // Canonical Lorensen-Cline lookup tables (1987 SIGGRAPH)
    const MC_EDGE_TABLE = new Int32Array([
      0x0,0x109,0x203,0x30a,0x406,0x50f,0x605,0x70c,0x80c,0x905,0xa0f,0xb06,0xc0a,0xd03,0xe09,0xf00,
      0x190,0x99,0x393,0x29a,0x596,0x49f,0x795,0x69c,0x99c,0x895,0xb9f,0xa96,0xd9a,0xc93,0xf99,0xe90,
      0x230,0x339,0x33,0x13a,0x636,0x73f,0x435,0x53c,0xa3c,0xb35,0x83f,0x936,0xe3a,0xf33,0xc39,0xd30,
      0x3a0,0x2a9,0x1a3,0xaa,0x7a6,0x6af,0x5a5,0x4ac,0xbac,0xaa5,0x9af,0x8a6,0xfaa,0xea3,0xda9,0xca0,
      0x460,0x569,0x663,0x76a,0x66,0x16f,0x265,0x36c,0xc6c,0xd65,0xe6f,0xf66,0x86a,0x963,0xa69,0xb60,
      0x5f0,0x4f9,0x7f3,0x6fa,0x1f6,0xff,0x3f5,0x2fc,0xdfc,0xcf5,0xfff,0xef6,0x9fa,0x8f3,0xbf9,0xaf0,
      0x650,0x759,0x453,0x55a,0x256,0x35f,0x55,0x15c,0xe5c,0xf55,0xc5f,0xd56,0xa5a,0xb53,0x859,0x950,
      0x7c0,0x6c9,0x5c3,0x4ca,0x3c6,0x2cf,0x1c5,0xcc,0xfcc,0xec5,0xdcf,0xcc6,0xbca,0xac3,0x9c9,0x8c0,
      0x8c0,0x9c9,0xac3,0xbca,0xcc6,0xdcf,0xec5,0xfcc,0xcc,0x1c5,0x2cf,0x3c6,0x4ca,0x5c3,0x6c9,0x7c0,
      0x950,0x859,0xb53,0xa5a,0xd56,0xc5f,0xf55,0xe5c,0x15c,0x55,0x35f,0x256,0x55a,0x453,0x759,0x650,
      0xaf0,0xbf9,0x8f3,0x9fa,0xef6,0xfff,0xcf5,0xdfc,0x2fc,0x3f5,0xff,0x1f6,0x6fa,0x7f3,0x4f9,0x5f0,
      0xb60,0xa69,0x963,0x86a,0xf66,0xe6f,0xd65,0xc6c,0x36c,0x265,0x16f,0x66,0x76a,0x663,0x569,0x460,
      0xca0,0xda9,0xea3,0xfaa,0x8a6,0x9af,0xaa5,0xbac,0x4ac,0x5a5,0x6af,0x7a6,0xaa,0x1a3,0x2a9,0x3a0,
      0xd30,0xc39,0xf33,0xe3a,0x936,0x83f,0xb35,0xa3c,0x53c,0x435,0x73f,0x636,0x13a,0x33,0x339,0x230,
      0xe90,0xf99,0xc93,0xd9a,0xa96,0xb9f,0x895,0x99c,0x69c,0x795,0x49f,0x596,0x29a,0x393,0x99,0x190,
      0xf00,0xe09,0xd03,0xc0a,0xb06,0xa0f,0x905,0x80c,0x70c,0x605,0x50f,0x406,0x30a,0x203,0x109,0x0,
    ]);

    const MC_TRI_TABLE = [
      [-1],
      [0,8,3,-1],
      [0,1,9,-1],
      [1,8,3,9,8,1,-1],
      [1,2,10,-1],
      [0,8,3,1,2,10,-1],
      [9,2,10,0,2,9,-1],
      [2,8,3,2,10,8,10,9,8,-1],
      [3,11,2,-1],
      [0,11,2,8,11,0,-1],
      [1,9,0,2,3,11,-1],
      [1,11,2,1,9,11,9,8,11,-1],
      [3,10,1,11,10,3,-1],

    function marchingCubes(vol, nx, ny, nz, isoLevel, densMax, xMin, xMax, yMin, yMax, zMin, zMax) {
      const dx = (xMax - xMin) / Math.max(1, nx - 1);
      const dy = (yMax - yMin) / Math.max(1, ny - 1);
      const dz = (zMax - zMin) / Math.max(1, nz - 1);
      const threshold = isoLevel / 100.0 * densMax;

      const wxOf = ix => xMin + ix * dx;
      const wyOf = iy => yMin + iy * dy;
      const wzOf = iz => zMin + iz * dz;
      const vIdx = (x, y, z) => x + y * nx + z * nx * ny;

      function interp(p1, v1, p2, v2) {
        if (Math.abs(v2 - v1) < 1e-12) return [p1[0], p1[1], p1[2]];
        const t = (threshold - v1) / (v2 - v1);
        return [p1[0] + t * (p2[0] - p1[0]), p1[1] + t * (p2[1] - p1[1]), p1[2] + t * (p2[2] - p1[2])];
      }

      const result = [];
      for (let iz = 0; iz < nz - 1; iz++) {
        for (let iy = 0; iy < ny - 1; iy++) {
          for (let ix = 0; ix < nx - 1; ix++) {
            const vals = [
              vol[vIdx(ix,   iy,   iz  )], vol[vIdx(ix+1, iy,   iz  )],
              vol[vIdx(ix+1, iy+1, iz  )], vol[vIdx(ix,   iy+1, iz  )],
              vol[vIdx(ix,   iy,   iz+1)], vol[vIdx(ix+1, iy,   iz+1)],
              vol[vIdx(ix+1, iy+1, iz+1)], vol[vIdx(ix,   iy+1, iz+1)],
            ];
            const pos = [
              [wxOf(ix),   wyOf(iy),   wzOf(iz)  ], [wxOf(ix+1), wyOf(iy),   wzOf(iz)  ],
              [wxOf(ix+1), wyOf(iy+1), wzOf(iz)  ], [wxOf(ix),   wyOf(iy+1), wzOf(iz)  ],
              [wxOf(ix),   wyOf(iy),   wzOf(iz+1)], [wxOf(ix+1), wyOf(iy),   wzOf(iz+1)],
              [wxOf(ix+1), wyOf(iy+1), wzOf(iz+1)], [wxOf(ix),   wyOf(iy+1), wzOf(iz+1)],
            ];
            let cubeIdx = 0;
            for (let i = 0; i < 8; i++) if (vals[i] < threshold) cubeIdx |= (1 << i);
            const et = MC_EDGE_TABLE[cubeIdx];
            if (!et) continue;

            const verts = new Array(12);
            if (et & 1)    verts[0]  = interp(pos[0], vals[0], pos[1], vals[1]);
            if (et & 2)    verts[1]  = interp(pos[1], vals[1], pos[2], vals[2]);
            if (et & 4)    verts[2]  = interp(pos[2], vals[2], pos[3], vals[3]);
            if (et & 8)    verts[3]  = interp(pos[3], vals[3], pos[0], vals[0]);
            if (et & 16)   verts[4]  = interp(pos[4], vals[4], pos[5], vals[5]);
            if (et & 32)   verts[5]  = interp(pos[5], vals[5], pos[6], vals[6]);
            if (et & 64)   verts[6]  = interp(pos[6], vals[6], pos[7], vals[7]);
            if (et & 128)  verts[7]  = interp(pos[7], vals[7], pos[4], vals[4]);
            if (et & 256)  verts[8]  = interp(pos[0], vals[0], pos[4], vals[4]);
            if (et & 512)  verts[9]  = interp(pos[1], vals[1], pos[5], vals[5]);
            if (et & 1024) verts[10] = interp(pos[2], vals[2], pos[6], vals[6]);
            if (et & 2048) verts[11] = interp(pos[3], vals[3], pos[7], vals[7]);

            const tt = MC_TRI_TABLE[cubeIdx];
            for (let i = 0; i < tt.length && tt[i] !== -1; i += 3) {
              result.push(verts[tt[i]], verts[tt[i+1]], verts[tt[i+2]]);
            }
          }
        }
      }

      const positions = new Float32Array(result.length * 3);
      let k = 0;
      for (const v of result) { positions[k++] = v[0]; positions[k++] = v[1]; positions[k++] = v[2]; }
      return positions;
    }

    function updateIsosurface(f) {
      if (!f.density_xyz || !DATA.nx || !DATA.ny || !DATA.nz) return;
      const isoLevel = Number(isoLevelCtl.value);
      const densMax = Math.max(1e-12, Number(DATA.dens_max) || 1e-9);
      const vol = new Float32Array(f.density_xyz);
      const positions = marchingCubes(
        vol, Number(DATA.nx), Number(DATA.ny), Number(DATA.nz),
        isoLevel, densMax,
        Number(DATA.x_min), Number(DATA.x_max),
        Number(DATA.y_min), Number(DATA.y_max),
        Number(DATA.z_min), Number(DATA.z_max)
      );
      if (isosurfaceMesh) { scene.remove(isosurfaceMesh); isosurfaceMesh = null; }
      if (positions.length === 0) return;
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      geo.computeVertexNormals();
      const mat = new THREE.MeshStandardMaterial({
        color: 0x36cfc9,
        transparent: true,
        opacity: 0.7,
        side: THREE.DoubleSide,
      });
      isosurfaceMesh = new THREE.Mesh(geo, mat);
      scene.add(isosurfaceMesh);
    }

    // ── renderFrame ───────────────────────────────────────────────────────────
    function renderFrame(frameIdx) {
      if (!DATA || !DATA.frames || DATA.frames.length === 0) return;
      const f = DATA.frames[frameIdx - 1];
      const renderMode = renderModeCtl.value;
      const colorMode = colorModeCtl.value;

      // Point cloud
      let drawn = 0;
      if (pointsMesh) pointsMesh.visible = (renderMode === "points");
      if (renderMode === "points") {
        drawn = updatePointCloud(f, colorMode);
      }

      // Slice planes
      if (renderMode === "slices" && (f.xy || f.xz || f.yz)) {
        sliceManager.updateAll(f, colorMode, DATA);
      } else {
        sliceManager.hideAll();
      }

      // Isosurface
      if (renderMode === "isosurface") {
        updateIsosurface(f);
      } else if (isosurfaceMesh) {
        scene.remove(isosurfaceMesh);
        isosurfaceMesh = null;
      }

      // Center-of-mass marker
      if (!marker) {
        marker = new THREE.Mesh(
          new THREE.SphereGeometry(0.16, 18, 14),
          new THREE.MeshStandardMaterial({ color: 0xffd06e, emissive: 0x8a5e1b, emissiveIntensity: 0.7 })
        );
        scene.add(marker);
      }
      marker.position.set(Number(f.exp_x || 0), Number(f.exp_y || 0), Number(f.exp_z || 0));

      slider.value = String(frameIdx);
      label.textContent = `frame ${frameIdx}/${DATA.frames.length}`;
      diag.textContent = renderMode === "points"
        ? `points=${drawn}/${(f.points||[]).length} vmax=${(f.point_vmax||0).toExponential(2)}`
        : `mode=${renderMode} t=${Number(f.t||0).toFixed(3)}`;
      meta.textContent = `boundary=${DATA.boundary||"?"}, potential=${DATA.potential_type||"?"}, t=${Number(f.t||0).toFixed(3)}, norm=${Number(f.norm||0).toFixed(6)}, <x,y,z>=(${Number(f.exp_x||0).toFixed(3)}, ${Number(f.exp_y||0).toFixed(3)}, ${Number(f.exp_z||0).toFixed(3)})`;
      drawColorbar();
    }

    function stepFrame(delta) {
      if (!DATA || !DATA.frames || DATA.frames.length === 0) return;
      const n = DATA.frames.length;
      let f = Number(slider.value || "1") + delta;
      if (f < 1) f = n;
      if (f > n) f = 1;
      renderFrame(f);
    }

    function loadData(obj) {
      if (!obj || !Array.isArray(obj.frames) || obj.frames.length === 0) {
        throw new Error("invalid spatial3d json: missing non-empty frames");
      }
      const hasPoints = Array.isArray(obj.frames[0].points);
      const hasSlices = obj.frames[0].xy != null;
      const hasVolume = obj.has_volume_grid === true && obj.frames[0].density_xyz != null;
      if (!hasPoints && !hasSlices && !hasVolume) {
        throw new Error("this viewer requires frame.points, frame.xy, or frame.density_xyz payload; regenerate json with latest exporter");
      }
      DATA = obj;
      sliceManager.removeAll();
      if (isosurfaceMesh) { scene.remove(isosurfaceMesh); isosurfaceMesh = null; }

      // Configure available render modes
      const rmOpts = renderModeCtl.options;
      for (let i = 0; i < rmOpts.length; i++) {
        const v = rmOpts[i].value;
        if (v === "points") rmOpts[i].disabled = !hasPoints;
        if (v === "slices") rmOpts[i].disabled = !hasSlices;
        if (v === "isosurface") rmOpts[i].disabled = !hasVolume;
      }
      // Default to best available mode
      if (hasSlices) renderModeCtl.value = "slices";
      else if (hasVolume) renderModeCtl.value = "isosurface";
      else renderModeCtl.value = "points";

      // Phase mode only available if data has phase
      colorModeCtl.options[1].disabled = !obj.has_phase;
      if (!obj.has_phase) colorModeCtl.value = "density";

      slider.max = String(DATA.frames.length);
      slider.value = "1";

      if (worldBox) scene.remove(worldBox);
      const box = new THREE.Box3(
        new THREE.Vector3(Number(DATA.x_min), Number(DATA.y_min), Number(DATA.z_min)),
        new THREE.Vector3(Number(DATA.x_max), Number(DATA.y_max), Number(DATA.z_max))
      );
      worldBox = new THREE.Box3Helper(box, 0x2d8fbf);
      scene.add(worldBox);
      fitCameraToBounds(Number(DATA.x_min), Number(DATA.x_max), Number(DATA.y_min), Number(DATA.y_max), Number(DATA.z_min), Number(DATA.z_max));
      renderFrame(1);
    }

    async function loadFromPath() {
      const path = pathInput.value.trim();
      if (!path) return;
      const res = await fetch(path);
      if (!res.ok) throw new Error(`failed to fetch ${path}: ${res.status}`);
      loadData(await res.json());
    }

    async function loadFromFile() {
      const file = document.getElementById("filePick").files[0];
      if (!file) throw new Error("select a json file first");
      loadData(JSON.parse(await file.text()));
    }

    function doPlay() {
      if (!DATA || timer) return;
      timer = setInterval(() => stepFrame(1), Number(playMsCtl.value));
    }
    function doPause() {
      if (!timer) return;
      clearInterval(timer);
      timer = null;
    }

    document.getElementById("play").onclick = doPlay;
    document.getElementById("pause").onclick = doPause;
    document.getElementById("prev").onclick = () => stepFrame(-1);
    document.getElementById("next").onclick = () => stepFrame(1);
    slider.oninput = () => renderFrame(Number(slider.value));
    pointSizeCtl.oninput = () => {
      if (pointsMesh && pointsMesh.material) {
        pointsMesh.material.size = Number(pointSizeCtl.value) / 100.0;
        pointsMesh.material.needsUpdate = true;
      }
    };
    cutoffCtl.oninput = () => {
      pointCutoffRatio = Number(cutoffCtl.value) / 100.0;
      renderFrame(Number(slider.value || "1"));
    };
    playMsCtl.oninput = () => {
      if (timer) { doPause(); doPlay(); }
    };
    autoRotateCtl.onchange = () => {
      controls.autoRotate = !!autoRotateCtl.checked;
    };
    renderModeCtl.onchange = () => renderFrame(Number(slider.value || "1"));
    colorModeCtl.onchange = () => {
      sliceManager.removeAll();
      renderFrame(Number(slider.value || "1"));
    };
    isoLevelCtl.oninput = () => {
      if (isosurfaceMesh) { scene.remove(isosurfaceMesh); isosurfaceMesh = null; }
      renderFrame(Number(slider.value || "1"));
    };
    document.getElementById("loadPath").onclick = async () => {
      try { await loadFromPath(); } catch (e) { meta.textContent = `Load error: ${e.message}`; }
    };
    document.getElementById("loadFile").onclick = async () => {
      try { await loadFromFile(); } catch (e) { meta.textContent = `Load error: ${e.message}`; }
    };

    window.addEventListener("keydown", (ev) => {
      if (ev.key === "ArrowLeft") stepFrame(-1);
      else if (ev.key === "ArrowRight") stepFrame(1);
      else if (ev.key === " ") {
        ev.preventDefault();
        if (timer) doPause(); else doPlay();
      }
    });

    function renderLoop() {
      const w = canvas.clientWidth || 1;
      const h = canvas.clientHeight || 1;
      if (canvas.width !== Math.floor(w * renderer.getPixelRatio()) || canvas.height !== Math.floor(h * renderer.getPixelRatio())) {
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(renderLoop);
    }
    renderLoop();
  </script>
</body>
</html>
