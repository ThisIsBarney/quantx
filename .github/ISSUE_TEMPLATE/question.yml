name: Question / Help
description: Ask a question about using QuantX
title: "[Question]: "
labels: ["question"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Ask anything about using QuantX here; questions stay searchable for the
        next person. The [README](https://github.com/ThisIsBarney/quantx#readme)
        covers what the engine does and how to read its results.

  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to do, and what is unclear?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What have you tried?
      description: |
        Paste any code you have tried so far and describe what you expected
        vs. what happened.
      render: python
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: QuantX version
      placeholder: "0.2.0"
    validations:
      required: false
