name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please include
        as much detail as possible so we can reproduce and fix the issue quickly.

  - type: input
    id: quantx_version
    attributes:
      label: QuantX version
      description: >
        Run `python -c "import quantx_engine; print(quantx_engine.__version__)"`.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: textarea
    id: backend
    attributes:
      label: Engine
      description: >
        Run `python -c "import quantx_engine; print(quantx_engine.backend_info())"`.
        It says whether the native engine was loaded. Say also how you installed it: a
        wheel from PyPI, or a source build (and its CMake options).
      render: text
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version
      description: Run `python --version`.
      placeholder: "3.11.7"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 22.04 / macOS 14 / Windows 11"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproducible example
      description: |
        Paste a short, self-contained Python snippet that triggers the bug.
        The fewer lines the better.
      render: python
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Full traceback (if applicable)
      description: Paste the complete error message and stack trace.
      render: text
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Anything else that might be relevant (hardware specs, env vars, etc.).
    validations:
      required: false
