name: Build Native C++ Engine

# Verifies that the CMake build produces a working shared library on Linux
# and Windows. Runs the C++ smoke tests (qx_smoke, qx_fft_smoke) to confirm
# the library loads and basic solver dispatch works.
#
# This job is intentionally decoupled from python-ci.yml so C++ failures
# do not block pure-Python SDK CI.

on:
  push:
    branches: ["master", "main"]
    paths:
      - "src/**"
      - "include/**"
      - "CMakeLists.txt"
      - ".github/workflows/build-native.yml"
  pull_request:
    branches: ["master", "main"]
    paths:
      - "src/**"
      - "include/**"
      - "CMakeLists.txt"
      - ".github/workflows/build-native.yml"
  workflow_dispatch:

concurrency:
  group: build-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Linux build ─────────────────────────────────────────────────────────────
  build-linux:
    name: Linux / GCC
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake g++ ninja-build libgomp1

      - name: Configure (Release)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQX_ENABLE_OPENMP=ON \
            -DQX_ENABLE_MPI=OFF \
            -DQX_ENABLE_PYBIND=OFF \
            -DQX_ENABLE_CUDA=OFF

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run C++ smoke tests
        run: |
          ./build/Release/qx_smoke || ./build/qx_smoke
          ./build/Release/qx_fft_smoke || ./build/qx_fft_smoke

      - name: Verify shared library exports
        run: |
          LIB=$(find build -name "libquantx.so" | head -n1)
          echo "Found library: $LIB"
          nm -D "$LIB" | grep "qx_run\|qx_version\|qx_list_solvers"

      - name: Test Python ctypes loading
        # Import only the engine module directly (not the full __init__.py)
        # to avoid pulling in numpy/scipy which are not installed in this job.
        run: |
          python3 -c "
          import ctypes, pathlib, os, sys
          lib_paths = list(pathlib.Path('build').rglob('libquantx.so'))
          if not lib_paths:
              print('ERROR: libquantx.so not found'); sys.exit(1)
          p = str(lib_paths[0])
          os.environ['QUANTX_LIB_PATH'] = p
          # Import the engine module in isolation; avoid quantx_engine/__init__.py
          # which would trigger numpy/scipy imports not present in this job.
          import importlib.util, types
          spec = importlib.util.spec_from_file_location(
              'engine', 'python/quantx_engine/engine.py')
          mod = importlib.util.module_from_spec(spec)
          # Stub the ctypes-independent sub-imports that __init__.py would pull
          sys.modules.setdefault('quantx_engine', types.ModuleType('quantx_engine'))
          spec.loader.exec_module(mod)
          e = mod.Engine(p)
          v = e.version()
          print(f'Native engine version: {v}')
          assert v, 'version string must be non-empty'
          print('ctypes load test PASSED')
          "

      - name: Symmetric models vs exact diagonalisation (M4 gate)
        # Solves every quantx_engine.models chain on this build's engine and compares with
        # an independent ED to 1e-10. The only job that runs Python tests against the
        # native library; QX_REQUIRE_NATIVE=1 makes a load failure fail the gate
        # instead of skipping it.
        env:
          QX_REQUIRE_NATIVE: "1"
        run: |
          python -m pip install -e "python/[dev]"
          export QUANTX_LIB_PATH="$(find "$PWD/build" -name libquantx.so | head -n1)"
          python -m pytest python/quantx_engine/tests/test_models_ed.py -v

      - name: Upload library artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantx-native-linux
          path: build/**/libquantx.so
          if-no-files-found: ignore

  # ── Windows build ───────────────────────────────────────────────────────────
  build-windows:
    name: Windows / MSVC
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure (Release)
        run: |
          cmake -S . -B build `
            -DCMAKE_BUILD_TYPE=Release `
            -DQX_ENABLE_OPENMP=OFF `
            -DQX_ENABLE_MPI=OFF `
            -DQX_ENABLE_PYBIND=OFF `
            -DQX_ENABLE_CUDA=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run C++ smoke tests
        run: |
          .\build\Release\qx_smoke.exe
          .\build\Release\qx_fft_smoke.exe

      - name: Verify DLL exports
        # This used to pipe dumpbin into Select-String. dumpbin exists only inside a Visual
        # Studio developer prompt, so the step died on "not recognized" the first time a
        # build got this far; and Select-String would not have failed on a missing export.
        # Load the DLL instead, and require the entry points the Python SDK binds.
        shell: pwsh
        run: |
          $dll = Get-ChildItem build -Recurse -Filter "quantx.dll" | Select-Object -First 1
          Write-Host "Found DLL: $($dll.FullName)"
          python -c "import ctypes, sys; lib = ctypes.CDLL(sys.argv[1]); need = ('qx_run', 'qx_version', 'qx_list_solvers', 'qx_free_string', 'qx_dmrg_sweep', 'qx_mps_energy'); missing = [s for s in need if not hasattr(lib, s)]; print('exports OK:', ', '.join(need)) if not missing else sys.exit('missing exports: ' + ', '.join(missing))" "$($dll.FullName)"

      - name: Upload library artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantx-native-windows
          path: build/**/*.dll
          if-no-files-found: ignore

  # ── Build gate ──────────────────────────────────────────────────────────────
  build-gate:
    name: Native build gate
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    if: always()
    steps:
      - name: Check all builds passed
        run: |
          if [[ "${{ needs.build-linux.result }}" != "success" || "${{ needs.build-windows.result }}" != "success" ]]; then
            echo "One or more native builds failed."
            exit 1
          fi
          echo "All native builds passed."
