name: Hardware Tests (M169)

# Real IBM Quantum hardware tests run ONLY when a PR is labelled "hardware"
# or when triggered manually.  They require QISKIT_IBM_TOKEN to be stored
# as a repository secret.
#
# For every push / PR we still run the mock-based unit tests (no token needed).

on:
  pull_request:
    types: [labeled, unlabeled, opened, synchronize, reopened]
    paths:
      - "examples/ibm_hardware_demo.py"
      - "python/quantx_engine/hardware.py"
      - "python/quantx_engine/ibm.py"
      - "python/quantx_engine/tests/test_ibm_hardware_roundtrip.py"
      - ".github/workflows/hardware-tests.yml"
  push:
    branches: ["master", "main"]
    paths:
      - "examples/ibm_hardware_demo.py"
      - "python/quantx_engine/hardware.py"
      - "python/quantx_engine/ibm.py"
      - "python/quantx_engine/tests/test_ibm_hardware_roundtrip.py"
      - ".github/workflows/hardware-tests.yml"
  workflow_dispatch:
    inputs:
      run_real_hardware:
        description: "Run real IBM Quantum hardware tests (requires QISKIT_IBM_TOKEN)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

concurrency:
  group: hardware-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Mock-based tests (always run, no credentials needed) ──────────────────

  mock-tests:
    name: Mock IBM API tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install QuantX SDK (no Qiskit required for mock tests)
        run: |
          python -m pip install --upgrade pip
          pip install -e "python/[dev]"

      - name: Run mock-based IBM hardware tests
        run: |
          python -m pytest python/quantx_engine/tests/test_ibm_hardware_roundtrip.py \
            -v -m "not hardware" \
            --tb=short

      - name: Dry-run ibm_hardware_demo.py (no token needed)
        run: python examples/ibm_hardware_demo.py --dry-run

  # ── Real hardware tests (only when PR has 'hardware' label) ────────────────

  real-hardware:
    name: Real IBM Quantum round-trip
    runs-on: ubuntu-latest
    # Run on manual trigger with run_real_hardware=true, OR on PRs labelled "hardware"
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.run_real_hardware == 'true') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'hardware'))

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install QuantX SDK + Qiskit IBM Runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e "python/[dev]"
          pip install "qiskit>=1.0" "qiskit-ibm-runtime>=0.20"

      - name: Run real IBM hardware round-trip test
        env:
          QISKIT_IBM_TOKEN: ${{ secrets.QISKIT_IBM_TOKEN }}
        run: |
          python -m pytest python/quantx_engine/tests/test_ibm_hardware_roundtrip.py \
            -v -m "hardware" \
            --tb=short

      - name: Run full demo against QASM simulator
        env:
          QISKIT_IBM_TOKEN: ${{ secrets.QISKIT_IBM_TOKEN }}
        run: |
          python examples/ibm_hardware_demo.py \
            --backend ibmq_qasm_simulator \
            --shots 1024 \
            --max-wait 300
