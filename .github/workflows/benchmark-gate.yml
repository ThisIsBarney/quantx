name: benchmark-gate

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  windows-benchmark-gate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        run: cmake -S . -B build-vs -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build-vs --config Debug

      - name: Test
        run: ctest --test-dir build-vs -C Debug --output-on-failure

      - name: Benchmark Accuracy
        shell: pwsh
        run: .\scripts\run_benchmark.ps1 -Suite benchmarks/suites/circuit_accuracy_smoke.json

      - name: Gate Accuracy
        shell: pwsh
        run: .\scripts\benchmark_gate.ps1 -Suite benchmarks/suites/circuit_accuracy_smoke.json
