name: benchmark-gate

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

concurrency:
  group: benchmark-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-benchmark-gate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Toolchain Probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/ci | Out-Null
          $probeLog = "out/ci/toolchain_probe.log"
          .\scripts\build.ps1 -ProbeToolchainOnly *>&1 | Tee-Object -FilePath $probeLog
          $probeExitCode = $LASTEXITCODE
          if ($probeExitCode -ne 0) {
            Write-Host "::group::Toolchain Probe Output (Failure Context)"
            if (Test-Path $probeLog) {
              Get-Content $probeLog
            } else {
              Write-Host "toolchain probe log missing: $probeLog"
            }
            Write-Host "::endgroup::"
            throw "toolchain probe failed before build; see grouped probe output above (exit code $probeExitCode)"
          }

      - name: Configure
        # No -G: the runner image picks the installed Visual Studio. Pinning "Visual Studio
        # 17 2022" failed configure outright once windows-latest moved to VS 2026 ("could
        # not find any instance of Visual Studio"), which is why this gate had been red.
        run: cmake -S . -B build-vs -A x64

      # Release, not Debug. In Debug, qx_hubbard_test (4^n-dimensional EDs, DMRG up to
      # chi=4096) ran past its 90-minute ctest timeout while the other 17 tests passed,
      # and benchmark numbers from an unoptimised build measure nothing.
      - name: Build
        run: cmake --build build-vs --config Release

      - name: Test
        run: ctest --test-dir build-vs -C Release --output-on-failure

      - name: CLI Argument Contract
        shell: pwsh
        run: .\scripts\test_cli_args.ps1 -SkipBuild -Config Release

      - name: Dependency License Policy
        shell: pwsh
        run: .\scripts\check_dependency_policy.ps1

      - name: Install Python dependencies for benchmarks
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy networkx pennylane
          pip install -e "python/[dev]"

      - name: Benchmark And Gate All
        shell: pwsh
        env:
          QX_BENCHMARK_PLATFORM_PROFILE: github-windows
        run: .\scripts\benchmark_all.ps1 -NoiseSweep -RunGates -EnforceGate -SkipBuild

      - name: Upload Benchmark Reports
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: benchmarks/reports/
          if-no-files-found: error

      - name: Upload Toolchain Probe Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toolchain-probe
          path: out/ci/toolchain_probe.log
          if-no-files-found: error
