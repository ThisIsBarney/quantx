name: benchmark-gate

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  windows-benchmark-gate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure
        run: cmake -S . -B build-vs -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build-vs --config Debug

      - name: Test
        run: ctest --test-dir build-vs -C Debug --output-on-failure

      - name: CLI Argument Contract
        shell: pwsh
        run: .\scripts\test_cli_args.ps1

      - name: Dependency License Policy
        shell: pwsh
        run: .\scripts\check_dependency_policy.ps1

      - name: Benchmark And Gate All
        shell: pwsh
        run: .\scripts\benchmark_all.ps1 -NoiseSweep -RunGates -EnforceGate -SkipBuild

      - name: Upload Benchmark Reports
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: benchmarks/reports/
          if-no-files-found: error
