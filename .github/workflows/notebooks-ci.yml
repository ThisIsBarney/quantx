name: Notebook CI

# Executes all tutorial notebooks on every push/PR to master.
# Uses nbmake (pytest plugin) so each notebook is a pytest test item.

on:
  push:
    branches: ["master", "main"]
    paths:
      - "notebooks/**"
      - "python/quantx_engine/**"
      - ".github/workflows/notebooks-ci.yml"
  pull_request:
    branches: ["master", "main"]
    paths:
      - "notebooks/**"
      - "python/quantx_engine/**"
      - ".github/workflows/notebooks-ci.yml"
  workflow_dispatch:

concurrency:
  group: notebooks-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebooks:
    name: Notebook execution / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r notebooks/requirements.txt
          pip install -e "python/[dev]"
          pip install "nbmake>=1.4" "nbformat>=5.9" ipykernel
          python -m ipykernel install --user

      - name: Execute notebooks with nbmake
        run: |
          mkdir -p reports
          pytest notebooks/ \
            --nbmake \
            --nbmake-timeout=120 \
            -v \
            --junit-xml=reports/notebooks-${{ matrix.python-version }}.xml

      - name: Upload notebook report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-report-${{ matrix.python-version }}
          path: reports/notebooks-${{ matrix.python-version }}.xml
          if-no-files-found: ignore
