name: Weekly Benchmarks

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      quick:
        description: "Use reduced problem sizes (quick mode)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

jobs:
  benchmark:
    name: Run benchmark suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install QuantX Engine
        run: pip install --upgrade pip && pip install -e "python/[dev]"

      - name: Install optional competitors (best-effort)
        run: |
          pip install scipy qutip pennylane stim tenpy || true

      - name: Run benchmarks
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.quick }}" = "true" ]; then
            ARGS="--quick"
          fi
          python benchmarks/run_all_benchmarks.py $ARGS

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ github.run_id }}
          path: |
            benchmarks/results_*.json
            benchmarks/BENCHMARKS.md
          retention-days: 90

      - name: Print BENCHMARKS.md summary
        run: cat benchmarks/BENCHMARKS.md
