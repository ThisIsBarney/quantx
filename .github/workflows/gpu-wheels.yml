name: GPU Wheels (M168)

# Builds and publishes CUDA 12-accelerated wheels for quantx-engine[gpu].
#
# The wheel content itself is identical to the CPU wheel; GPU acceleration
# is provided at runtime by CuPy (cupy-cuda12x), which is declared as the
# [gpu] optional dependency.  This workflow:
#
#   1. Builds the standard manylinux wheel with cibuildwheel.
#   2. Runs GPU-capability unit tests (mock-based, no CUDA hardware needed).
#   3. On version tags: publishes to PyPI so that
#        pip install "quantx-engine[gpu]"
#      installs the wheel + cupy-cuda12x automatically.
#   4. On NVIDIA self-hosted runner (optional): runs a real CuPy smoke test.

on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
    paths:
      - "python/quantx_engine/gpu.py"
      - "python/quantx_engine/mps_simulator.py"
      - "python/quantx_engine/lanczos.py"
      - "python/quantx_engine/tests/test_gpu_wheel.py"
      - "python/pyproject.toml"
      - ".github/workflows/gpu-wheels.yml"
  pull_request:
    branches: ["master", "main"]
    paths:
      - "python/quantx_engine/gpu.py"
      - "python/quantx_engine/tests/test_gpu_wheel.py"
      - ".github/workflows/gpu-wheels.yml"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI (only works on a version tag)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

concurrency:
  group: gpu-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Mock-based GPU unit tests (always run, no CUDA hardware needed) ──────────

  gpu-unit-tests:
    name: GPU unit tests / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install QuantX SDK (no CuPy — tests the fallback path)
        run: |
          python -m pip install --upgrade pip
          pip install -e "python/[dev]"

      - name: Run GPU unit tests (CuPy-absent fallback path)
        run: |
          python -m pytest python/quantx_engine/tests/test_gpu_wheel.py \
            -v --tb=short

  # ── Build GPU-capable wheel with cibuildwheel ────────────────────────────────

  build-gpu-wheel:
    name: Build GPU wheel (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: pip install cibuildwheel==2.22.0

      - name: Build wheel (Linux manylinux_2_28)
        env:
          # Override the manylinux image to one with CUDA 12 headers available
          # so the native extension can be linked against CUDA at build time.
          # The wheel remains manylinux-compatible; CUDA runtime is provided
          # by the end-user's driver via CuPy at import time.
          CIBW_MANYLINUX_X86_64_IMAGE: "quay.io/pypa/manylinux_2_28_x86_64"
          CIBW_BUILD: "cp311-manylinux_x86_64 cp312-manylinux_x86_64"
          CIBW_ENVIRONMENT: >
            QUANTX_BUILD_CUDA=1
            CUDA_PATH=/usr/local/cuda
        run: cibuildwheel --output-dir wheelhouse python/

      - name: Upload GPU wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpu-wheel-linux
          path: wheelhouse/*.whl
          if-no-files-found: warn

  # ── Smoke-test: install wheel + cupy and verify gpu_info() ──────────────────

  smoke-test-gpu-extra:
    name: Smoke test — quantx-engine[gpu] install
    needs: [build-gpu-wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: gpu-wheel-linux
          path: wheelhouse/
        continue-on-error: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install wheel with [gpu] extra (CuPy will be pulled from PyPI)
        run: |
          python -m pip install --upgrade pip
          # Install from local wheelhouse if available, else from PyPI
          if ls wheelhouse/*.whl 1>/dev/null 2>&1; then
            pip install numpy scipy networkx
            pip install --no-index --find-links=wheelhouse --no-deps quantx-engine
          else
            pip install "quantx-engine==0.4.0"
          fi
          # Install CuPy CPU stub (cupy-cuda12x fails on CPU-only runners;
          # install numpy-only cupy shim for import-path testing)
          pip install cupy-cuda12x --extra-index-url https://pip.cupy.dev/aarch64 || true
        continue-on-error: true

      - name: Verify gpu_info() runs without error
        run: |
          python - <<'EOF'
          from quantx_engine.gpu import gpu_info, GpuBackend, GpuError
          info = gpu_info()
          print("gpu_info():", info)
          assert "cupy_available" in info
          # GpuBackend('numpy') must always work
          b = GpuBackend("numpy")
          assert b.name == "numpy"
          assert not b.is_gpu()
          print("GPU smoke test PASSED (numpy fallback path)")
          EOF

  # No PyPI publish here. This job used to upload a Linux wheel to the SAME project and
  # version as build-wheels.yml on every v* tag -- same filename, so whichever finished
  # first won and the other failed, and which Linux wheel users got was a race. PyPI never
  # lets a filename be re-uploaded, so a lost race is permanent. build-wheels.yml is the
  # only publisher; a GPU build needs its own distribution name or a separate index.

  # ── Real CUDA hardware test (self-hosted NVIDIA runner, optional) ────────────

  real-cuda-test:
    name: Real CUDA smoke test
    runs-on: [self-hosted, gpu, cuda-12]
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install quantx-engine[gpu]
        run: |
          python -m pip install --upgrade pip
          pip install -e "python/[gpu,dev]"

      - name: Run real CuPy GPU tests
        run: |
          python -m pytest python/quantx_engine/tests/test_gpu_wheel.py \
            -v --tb=short -m "gpu"

      - name: Run gpu_info() on real hardware
        run: |
          python - <<'EOF'
          from quantx_engine.gpu import gpu_info, GpuBackend
          info = gpu_info()
          print("GPU info:", info)
          assert info["cupy_available"], "CuPy not available on GPU runner"
          assert info.get("n_devices", 0) >= 1, "No CUDA devices found"
          b = GpuBackend("cupy")
          assert b.is_gpu()
          import numpy as np
          arr = b.array(np.ones(4, dtype=complex))
          assert b.to_numpy(arr).shape == (4,)
          print(f"CUDA smoke test PASSED — {info['n_devices']} device(s)")
          EOF
