name: Release (build + optional publish)

# Build job runs on every version tag push and on manual dispatch — useful for
# verifying the wheel builds cleanly before you decide to publish.
#
# PyPI publishing and GitHub Release creation are INTENTIONALLY gated behind
# a manual workflow_dispatch with publish=true.  Tag pushes alone do NOT
# trigger publishing.
#
# To release when you are ready:
#   1. Merge all changes to master
#   2. git tag v1.0.0 && git push origin v1.0.0   (triggers the build job only)
#   3. Verify the build artefacts look correct in the Actions summary
#   4. Go to Actions → Release → Run workflow → set publish=true → Run
#      (this downloads the artefacts from step 2 and publishes them)

on:
  push:
    tags:
      - "v*"    # triggers the build job only — no publish
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI and create GitHub Release (requires a version tag)"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      tag:
        description: "Tag to publish (e.g. v1.0.0) — must already exist on origin"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Build wheel + sdist (always runs) ────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build wheel and sdist
        run: python -m build python/

      - name: Verify distributions with twine check
        run: twine check python/dist/*

      - name: Upload dist artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/
          if-no-files-found: error

  # ── Publish to PyPI (manual only, publish=true required) ─────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
    environment:
      name: pypi
      url: https://pypi.org/p/quantx-engine
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (OIDC trusted publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          verbose: true

  # ── Create GitHub Release (manual only, publish=true required) ───────────
  github-release:
    name: Create GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Resolve tag name
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG entry for this version
        id: changelog
        run: |
          python - <<'EOF'
          import re, os, pathlib

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          version = os.environ["VERSION"]

          pattern = rf"## \[{re.escape(version)}\].*?\n(.*?)(?=\n## \[|\Z)"
          m = re.search(pattern, changelog, re.DOTALL)
          body = m.group(1).strip() if m else f"Release {version}"

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("body<<EOF_BODY\n")
              f.write(body)
              f.write("\nEOF_BODY\n")
          EOF
        env:
          VERSION: ${{ steps.tag.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "quantx-engine ${{ steps.tag.outputs.tag }}"
          body: ${{ steps.changelog.outputs.body }}
          files: dist/*
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, 'rc') || contains(steps.tag.outputs.tag, 'beta') || contains(steps.tag.outputs.tag, 'alpha') }}
