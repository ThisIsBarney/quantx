name: Release (GitHub Release notes)

# What publishes what -- read this before pushing a tag:
#
#   * PyPI: build-wheels.yml. A pushed v* tag builds the platform wheels and the sdist,
#     smoke-tests them, and uploads them to PyPI through its `publish` job (trusted
#     publishing, gated by the `pypi` environment). A tag push IS a PyPI release: an upload
#     cannot be undone, and PyPI never accepts the same version twice.
#   * GitHub Release: this workflow, by hand only (Actions -> Release -> Run workflow,
#     publish=true, tag=vX.Y.Z). It attaches the sdist; the wheels are on PyPI.
#
# The build job below also runs on every tag push, but only builds the sdist and runs
# twine check on it. It publishes nothing. See RELEASING.md for the whole procedure.

on:
  push:
    tags:
      - "v*"    # this workflow only builds the sdist; build-wheels.yml publishes to PyPI
  workflow_dispatch:
    inputs:
      publish:
        description: "Create GitHub Release (requires a version tag; PyPI is published by build-wheels.yml)"
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      tag:
        description: "Tag to publish (e.g. v1.0.0) — must already exist on origin"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Build + check the sdist (always runs; publishes nothing) ─────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      # sdist only. A wheel from plain `python -m build` carries no native library (the
      # platform wheels come from cibuildwheel in build-wheels.yml), so it is no release
      # asset.
      - name: Build sdist
        run: python -m build --sdist python/

      - name: Verify distributions with twine check
        run: twine check python/dist/*

      - name: Upload dist artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/
          if-no-files-found: error

  # ── Publish to PyPI (manual only, publish=true required) ─────────────────
  # PyPI publishing lives ONLY in build-wheels.yml (native platform wheels + smoke test).
  # This workflow used to be a second path to PyPI; two publishers for one version race,
  # and PyPI never allows a filename to be uploaded twice.

  # ── Create GitHub Release (manual only, publish=true required) ───────────
  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Resolve tag name
        id: tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Extract CHANGELOG entry for this version
        id: changelog
        run: |
          python - <<'EOF'
          import re, os, pathlib

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          version = os.environ["VERSION"]

          # Stop at ANY level-2 heading: the history section below the releases is one,
          # and stopping only at "## [" would pull it into the release notes.
          pattern = rf"## \[{re.escape(version)}\].*?\n(.*?)(?=\n## |\Z)"
          m = re.search(pattern, changelog, re.DOTALL)
          body = m.group(1).strip() if m else f"Release {version}"
          body = re.sub(r"\n-{3,}$", "", body).strip()  # the rule that closes the section

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("body<<EOF_BODY\n")
              f.write(body)
              f.write("\nEOF_BODY\n")
          EOF
        env:
          VERSION: ${{ steps.tag.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "quantx-engine ${{ steps.tag.outputs.tag }}"
          body: ${{ steps.changelog.outputs.body }}
          files: dist/*
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, 'rc') || contains(steps.tag.outputs.tag, 'beta') || contains(steps.tag.outputs.tag, 'alpha') }}
