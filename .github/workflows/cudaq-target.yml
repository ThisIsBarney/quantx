name: CUDA-Q target

# M14: the CUDA-Q target "quantx" (src/cudaq/), run against CUDA-Q's own CPU state vector,
# qpp-cpu, from both of CUDA-Q's languages. Python: built against CUDA-Q's pip packages
# (python/quantx_engine/tests/test_cudaq_target.py, and test_cudaq_examples.py for the examples
# of CUDA-Q's documentation); cudaq-core carries the headers and the CMake configuration a native
# backend builds against, and cuda-quantum-cu12 adds the Python front end. C++: built in CUDA-Q's
# container, which has nvq++ (scripts/cudaq_cpp_check.sh, test_cudaq_cpp.py), where the Python
# tests run again, on the compiled description of the target nvq++ needs. Everything runs on the
# runner's CPU.

on:
  push:
    branches: ["master", "main"]
    paths:
      - "src/**"
      - "include/**"
      - "CMakeLists.txt"
      - "python/quantx_engine/tests/test_cudaq_target.py"
      - "python/quantx_engine/tests/test_cudaq_examples.py"
      - "python/quantx_engine/tests/test_cudaq_cpp.py"
      - "scripts/cudaq_cpp_check.sh"
      - ".github/workflows/cudaq-target.yml"
  pull_request:
    branches: ["master", "main"]
    paths:
      - "src/**"
      - "include/**"
      - "CMakeLists.txt"
      - "python/quantx_engine/tests/test_cudaq_target.py"
      - "python/quantx_engine/tests/test_cudaq_examples.py"
      - "python/quantx_engine/tests/test_cudaq_cpp.py"
      - "scripts/cudaq_cpp_check.sh"
      - ".github/workflows/cudaq-target.yml"
  workflow_dispatch:

jobs:
  cudaq-target:
    name: CUDA-Q target (M14)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CUDA-Q and the build tools
        # Without the GPU libraries cuda-quantum-cu12 depends on (cuStateVec, cuTensorNet, CuPy,
        # cuBLAS, ...): the job runs on the CPU, and qpp-cpu and quantx need none of them.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y cmake g++ ninja-build libgomp1
          python -m pip install --no-deps "cuda-quantum-cu12==0.17.0" "cudaq-core==0.17.0"
          python -m pip install numpy scipy astpretty requests pytest

      - name: Configure against CUDA-Q
        run: |
          NVQIR_CONFIG="$(find "$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')" \
                          -name NVQIRConfig.cmake | head -n1)"
          echo "NVQIR config: $NVQIR_CONFIG"
          test -n "$NVQIR_CONFIG"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQX_ENABLE_CUDA=OFF \
            -DQX_ENABLE_CUDAQ=ON \
            -DNVQIR_DIR="$(dirname "$NVQIR_CONFIG")"

      - name: Build the target
        run: cmake --build build --target nvqir-quantx --parallel $(nproc)

      - name: Install it into CUDA-Q
        run: cmake --install build

      - name: CUDA-Q kernels on quantx against qpp-cpu
        # QX_REQUIRE_CUDAQ=1: a target that did not install fails the job instead of
        # skipping the tests.
        env:
          QX_REQUIRE_CUDAQ: "1"
        run: |
          python -m pytest -v \
            python/quantx_engine/tests/test_cudaq_target.py \
            python/quantx_engine/tests/test_cudaq_examples.py

  cudaq-container:
    # nvq++ --target quantx: CUDA-Q's C++ toolchain is in its container, not in the pip packages.
    name: CUDA-Q target in CUDA-Q's container, C++ and Python (M14)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Pull CUDA-Q's container
        run: docker pull nvcr.io/nvidia/quantum/cuda-quantum:cu12-0.17.0

      - name: Programs compiled by nvq++, and Python kernels, on quantx against qpp-cpu
        # The container's entry point runs its command with bash.
        run: |
          docker run --rm --user root -v "$PWD":/src -w /src \
            nvcr.io/nvidia/quantum/cuda-quantum:cu12-0.17.0 \
            scripts/cudaq_cpp_check.sh
