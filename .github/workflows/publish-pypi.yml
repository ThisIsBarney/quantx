name: publish-pypi

on:
  push:
    branches: ["master", "main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Target: testpypi or pypi"
        required: false
        default: "testpypi"

jobs:
  build-wheel:
    name: Build Python wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build
        run: pip install --upgrade build

      - name: Build wheel and sdist
        working-directory: python
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: quantx-dist
          path: python/dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build-wheel
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi')
    environment:
      name: testpypi
      url: https://test.pypi.org/p/quantx-engine
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: quantx-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: build-wheel
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
    environment:
      name: pypi
      url: https://pypi.org/p/quantx-engine
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: quantx-dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
