name: Python CI

# Runs the full pure-Python test suite (SDK + all server tests) on every
# push and pull-request targeting master/main.  No C++ build is required —
# all tested modules are self-contained Python.
#
# No path filters are used so ci-gate always runs and never leaves branch-
# protection checks pending when only non-code files change.

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── SDK tests (quantx_engine) ───────────────────────────────────────────────
  sdk:
    name: SDK / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install SDK and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scipy networkx pennylane
          pip install -e "python/[dev]"

      - name: Run SDK tests
        run: |
          pytest python/quantx_engine/tests/ \
            -q --tb=short \
            --junit-xml=reports/sdk-${{ matrix.python-version }}.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-report-${{ matrix.python-version }}
          path: reports/sdk-${{ matrix.python-version }}.xml
          if-no-files-found: ignore

  # ── Server route tests ──────────────────────────────────────────────────────
  server:
    name: Server / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            python/pyproject.toml
            server/pyproject.toml

      - name: Install all dependencies
        run: |
          python -m pip install --upgrade pip
          # SDK and its scientific deps
          pip install scipy networkx pennylane
          pip install -e "python/[dev]"
          # FastAPI server + test client + M105 persistent backend deps
          pip install "fastapi>=0.110.0" "httpx>=0.27.0" anyio pydantic \
                      "aiosqlite>=0.19.0" "pytest-asyncio>=0.23.0"
          # M107: optional observability deps
          pip install "prometheus_client>=0.19.0"

      - name: Run server tests
        env:
          # Repo root on sys.path so `import server.main` resolves
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest server/tests/ \
            -q --tb=short \
            --junit-xml=reports/server-${{ matrix.python-version }}.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-report-${{ matrix.python-version }}
          path: reports/server-${{ matrix.python-version }}.xml
          if-no-files-found: ignore

  # ── Required status gate ────────────────────────────────────────────────────
  # A single always-passing job that depends on both matrix jobs.
  # Branch protection rules can require just this one job.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    needs: [sdk, server]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.sdk.result }}" != "success" || "${{ needs.server.result }}" != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
