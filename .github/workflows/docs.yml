name: Docs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: |
          pip install -r docs/source/requirements.txt
          # Install quantx-engine in pure-Python mode (no C++ build required).
          # This used to be `--no-build-isolation 2>/dev/null || true`. Python 3.12+ has no
          # setuptools by default, so without build isolation there was no build backend;
          # the install failed, `|| true` hid it, and Sphinx failed later on "No module
          # named 'numpy'" -- far from the cause. Let an install failure fail here.
          pip install -e "python/"

      - name: Build Sphinx docs
        run: |
          set -euo pipefail
          cd docs
          # Auto-generate RST stubs for any new modules not yet in source/api/generated/
          sphinx-apidoc \
            --output-dir source/api/generated \
            --separate \
            --module-first \
            --force \
            ../python/quantx_engine \
            "../python/quantx_engine/tests" \
            2>/dev/null || true
          # Build HTML — treat warnings as errors; fall back to lenient build if
          # an autodoc import error is the only failure (e.g. optional C extension).
          if ! sphinx-build -b html source _build/html -W --keep-going -n; then
            echo "::warning::Strict Sphinx build had warnings; retrying without -W"
            sphinx-build -b html source _build/html --keep-going
          fi

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "docs: deploy from ${{ github.sha }}"
